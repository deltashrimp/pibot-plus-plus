server:
  port: ${AI_PORT:8082}

spring:
  application:
    name: ai-service

# Actuator endpoints (health is public; the Docker healthcheck probes /health).
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

ai:
  # Base URL of Core's internal REST API (built from CORE_HOST/CORE_PORT).
  core-api-url: ${CORE_API_URL:http://${CORE_HOST:core}:${CORE_PORT:8080}}
  # Key that callers must send as the X-API-Key header (env AI_API_KEY).
  api-key: ${AI_API_KEY:default-key}

logging:
  config: classpath:logback-spring.xml
