plugins {
  id 'java'
  id 'application'
  id 'org.springframework.boot' version '4.1.0'
  id 'io.spring.dependency-management' version '1.1.5'
}


group = 'com.isthisalis'
version = '1.0.0'

application {
    mainClass.set('com.isthisalis.pibot.aiservice.AiService')
}

jar {
    manifest.attributes('Main-Class': 'com.isthisalis.pibot.aiservice.AiService')
}


java {
  sourceCompatibility = '21'
  targetCompatibility = '21'
}


repositories {
  mavenCentral()
}


dependencies {
   implementation 'org.springframework.boot:spring-boot-starter-web:4.1.0'
   implementation 'org.springframework.boot:spring-boot-starter-data-rest:4.1.0'
   //implementation 'org.springframework.boot:spring-boot-starter-security'

   implementation 'org.slf4j:slf4j-api'

   implementation 'io.github.isthisalis:ailib:1.0.2'

   compileOnly 'org.projectlombok:lombok:1.18.46'
   annotationProcessor 'org.projectlombok:lombok:1.18.46'

   implementation 'tools.jackson.dataformat:jackson-dataformat-yaml:3.2.1'
}
