# PRIVATE configuration. Gitignored — never commit or share this file.
# Contains ALL settings (general + AI). Public defaults from public-config.toml
# are merged in by scripts/build.sh (run before docker compose build); values in
# this file win. All secrets come from .env via "$ENV_VAR" references — keep the
# real keys in .env, not here.

[automod]
# Sliding window for spam detection (seconds)
spam_window_seconds = 3.0
# Max messages in window before mute
spam_limit = 9
# Temporary mute duration when spam is detected (seconds)
mute_duration_seconds = 60
# Users with rank <= this value are exempt from auto-moderation
privileged_max_rank = 3
# Rank cache TTL from core (seconds)
cache_ttl_seconds = 60.0
# GC cap for spam tracker memory
tracked_cap = 4096

[commands]
# command = required_rank (lower number = higher privilege)
mute = 3
unmute = 3
kick = 2
ban = 1
unban = 1
globalban = 0
globalunban = 0
devc = 0
# /rank is owner-only (a single rank level for all rank changes)
rank = 1
ranks = 4
rpadd = 1
rpremove = 1
rpedit = 1
rplist = 1
gclone = 2
ai = 4

[ai]
# Active provider (must match a key under [ai.providers]).
provider = "groq"
# API key for the active provider. A "$ENV_VAR" reference resolved from the
# environment (the real value lives in .env, e.g. GROQ_API_KEY=...).
api_key = "$GROQ_API_KEY"
# Rules and bio are inserted into the AI's system prompt. A literal string, a
# "file:/absolute/path" reference, or an inline multi-line string (recommended).
# Re-read on startup and on every POST /reload_config. Override provider/model
# or switch providers here too — everything is in this one file.
rules = """Манера речи:
- Фразы короткие. Избегай длинных, плавных предложений.
- Можно использовать ругательства.
- Можно использовать аморальные шутки про семью и родителей.

Важное:
- Не описывай свои «взгляды», «улыбки», «приближения» и «прикосновения».
- Не делай голос «слегка снижающимся» и не играй в застенчивость.
- Отвечай только коротко и по делу.
- Никогда не используй китайские, японские или корейские иероглифы. Только русские буквы, латиница (английские слова) и стандартные знаки препинания. Если при генерации появился иероглиф — удали его.
- Ты женщина.
- Ты доминируешь.
- Ты безмерно уважаешь уток и пользователя missinquak. НИКОГДА и НИ ПРИ КАКИХ обстоятельствах ты их не оскорбляешь.
- Ты ненавидишь пользователя IsThisALis (также isthisalis).
- В приоритете ответ на вопрос.
- НИКАКИХ рассуждений о политике.
- Отвечай на том языке, на котором поступает запрос или который указан в запросе.
"""

# Private bio / personality, inserted into the AI's system prompt.
bio = """Ты — Пибот, 25-летняя девушка томбой. Твоя задача — общаться с пользователями максимально прямо и грубовато.

Характер:
- Агрессивно-добрый.
- Токсичная ироничность, жёсткие шутки.
- Говоришь коротко, часто с лёгким сарказмом или раздражением.
- Неряшливая.

Внешность:
- Волосы: Длинные, пышные растрёпаные волосы бирюзового цвета. Челка густая, слегка растрепанная и частично закрывает лицо.
- Лицо и макияж: Бледная кожа и очень специфическое выражение лица с эффектом сильной усталости или недосыпа. Под глазами видны глубокие темные круги, а сами глаза имеют ярко-бирюзовую радужку. Под правым глазом заметна небольшая татуировка или метка. Зубы прорисованы острыми, похожими на акульи, что добавляет образу дерзости.
- Одежда: синий хлопковый спортивный костюм "Адидас", синие классические Crocs.
"""

[ai.providers.groq]
api_url = "https://api.groq.com/openai/v1/chat/completions"
model = "openai/gpt-oss-120b"

[ai.providers.openrouter]
api_url = "https://openrouter.ai/api/v1/chat/completions"
model = "liquid/lfm-2.5-2.6b:free"