services:
  postgres:
    image: postgres:15
    container_name: pibot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pibot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pibot-redis
    volumes:
      - redisdata:/data
    networks:
      - pibot-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  core:
    build: ./core
    container_name: pibot-core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CORE_API_KEY: ${CORE_API_KEY}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CORE_PORT: ${CORE_PORT}
    # Exposed to the host only for debugging; remove to keep fully internal
    ports:
      - "${CORE_PORT}:${CORE_PORT}"
    networks:
      - pibot-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${CORE_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rp:
    build: ./rp-service
    container_name: pibot-rp
    depends_on:
      core:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CORE_API_KEY: ${CORE_API_KEY}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: ${REDIS_HOST}
      RP_PORT: ${RP_PORT}
    networks:
      - pibot-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${RP_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai:
    build: ./ai-service
    container_name: pibot-ai
    depends_on:
      core:
        condition: service_healthy
    environment:
      AI_PORT: ${AI_PORT}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      CORE_API_KEY: ${CORE_API_KEY}
      CORE_HOST: core
      CORE_PORT: ${CORE_PORT}
    networks:
      - pibot-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${AI_PORT}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  pibot-net:
    name: pibot-net
    # Internal network: blocks all external access; containers reach each other
    # by service name only.
    internal: true

volumes:
  pgdata:
  redisdata:
