services:
  postgres:
    image: postgres:15
    container_name: pibot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pibot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pibot-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - pibot-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  core:
    build: ./core
    container_name: pibot-core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      CORE_API_KEY: ${CORE_API_KEY}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CORE_PORT: ${CORE_PORT}
      RP_SERVICE_URL: ${RP_SERVICE_URL}
      RP_API_KEY: ${RP_API_KEY}
    networks:
      - pibot-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${CORE_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rp:
    build: ./rp-service
    container_name: pibot-rp
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: 6379
      RP_PORT: ${RP_PORT}
      RP_API_KEY: ${RP_API_KEY}
      RP_PHRASES_FILE: /app/rp_phrases.json
    networks:
      - pibot-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${RP_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ai:
  #   build: ./ai-service
  #   container_name: pibot-ai
  #   depends_on:
  #     core:
  #       condition: service_healthy
  #   environment:
  #     AI_PORT: ${AI_PORT}
  #     AI_API_KEY: ${AI_API_KEY}
  #     GROQ_API_KEY: ${GROQ_API_KEY}
  #     OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  #     CORE_API_KEY: ${CORE_API_KEY}
  #     CORE_HOST: core
  #     CORE_PORT: ${CORE_PORT}
  #   networks:
  #     - pibot-net
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:${AI_PORT}/health || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

  auto-mod:
    build: ./auto-mod
    container_name: pibot-auto-mod
    environment:
      CORE_API_KEY: ${CORE_API_KEY}
      CORE_HOST: core
      CORE_PORT: ${CORE_PORT}
      AUTO_MOD_PORT: ${AUTO_MOD_PORT}
    networks:
      - pibot-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${AUTO_MOD_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  pibot-net:
    name: pibot-net
    # Containers reach each other by service name; the network is NOT internal
    # because core needs outbound access to the Telegram API and ai to LLM APIs.
    # No service publishes ports, so nothing is exposed to the host.

volumes:
  pgdata:
  redisdata:
