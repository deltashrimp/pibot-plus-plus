# Public default settings. Safe to share with the repository.
# These are the "factory defaults": scripts/build.sh copies this file into the
# private config.toml (gitignored), which holds ALL settings and wins on
# conflicts. Change values here only if you want to update the defaults that
# other deployments start from. All secrets belong in .env and are referenced
# here/above only via "$ENV_VAR" placeholders.

[automod]
# Sliding window for spam detection (seconds)
spam_window_seconds = 3.0
# Max messages in window before mute
spam_limit = 9
# Temporary mute duration when spam is detected (seconds)
mute_duration_seconds = 60
# Users with rank <= this value are exempt from auto-moderation
privileged_max_rank = 3
# Rank cache TTL from core (seconds)
cache_ttl_seconds = 60.0
# GC cap for spam tracker memory
tracked_cap = 4096

[commands]
# command = required_rank (lower number = higher privilege)
mute = 3
unmute = 3
kick = 2
ban = 1
unban = 1
globalban = 0
globalunban = 0
devc = 0
# /rank is owner-only (a single rank level for all rank changes)
rank = 1
ranks = 4
rpadd = 1
rpremove = 1
rpedit = 1
rplist = 1
gclone = 2
ai = 4

[ai]
# Active provider (must match a key under [ai.providers]).
provider = "groq"
# API key reference resolved from the environment via .env (real value never
# lives in the repo). Override in private config.toml if needed.
api_key = "$GROQ_API_KEY"
# Rules and bio are inserted into the AI's system prompt. Kept empty here; set
# them in the private config.toml.
rules = ""
bio = ""

[ai.providers.groq]
api_url = "https://api.groq.com/openai/v1/chat/completions"
model = "openai/gpt-oss-120b"

[ai.providers.openrouter]
api_url = "https://openrouter.ai/api/v1/chat/completions"
model = "liquid/lfm-2.5-2.6b:free"